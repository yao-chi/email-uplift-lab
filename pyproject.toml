[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uplift-lab"
version = "0.1.0"
description = "增量（uplift）评估与预算分配：Hillstrom 邮件营销随机实验"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yao Chi" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "duckdb>=0.10",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]